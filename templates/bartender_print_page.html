{% extends 'base.html' %}

{% block content %}
<!DOCTYPE html>

<html lang="hu">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nyomtatás Beállítása</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<h2>Nyomtatás beállítása</h2>
<form id="printForm">
<label for="pn">PN (Part Number):</label>
<input id="pn" name="pn" onblur="fetchBtwFile()" type="text"/><br/><br/>
<label for="etiket_file">Automatikusan kiválasztott BTW fájl:</label>
<input id="etiket_file" name="etiket_file" readonly="" type="text"/><br/><br/>
<label for="qty">Darabszám:</label>
<input id="qty" name="qty" type="number" value="1"/><br/><br/>
<label for="printer">Nyomtató:</label>
<input id="printer" name="printer" type="text" value="SIL-PRT-28 (A3)"/><br/><br/>
<label for="named_data_source">Named Data Source érték:</label>
<input id="named_data_source" name="named_data_source" type="text" value="DefaultValue"/><br/><br/>
<button onclick="sendPrintRequest()" type="button">Nyomtatás</button>
</form>
<h3 id="responseMessage"></h3>
<script>
        function fetchBtwFile() {
            let pnValue = $("#pn").val().trim();

            if (!pnValue) {
                $("#etiket_file").val("");
                return;
            }

            $.post("/get_btw_from_pn", { pn: pnValue }, function(data) {
                if (data.found) {
                    $("#etiket_file").val(data.etiket);
                } else {
                    alert("PN nem található az adatbázisban!");
                    $("#etiket_file").val("");
                }
            }).fail(function(xhr) {
                alert("Hiba történt: " + xhr.responseJSON.error);
            });
        }

        function sendPrintRequest() {
            let formData = new FormData(document.getElementById("printForm"));

            fetch("/bartender_print", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("responseMessage").innerText = 
                    "Sikeres nyomtatás: " + JSON.stringify(data, null, 2);
            })
            .catch(error => {
                document.getElementById("responseMessage").innerText = 
                    "Hiba: " + error;
            });
        }
    </script>
</body>
</html>
{% endblock %}
