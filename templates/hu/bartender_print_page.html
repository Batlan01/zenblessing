{% extends 'base.html' %}

{% block content %}
<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Bartender Nyomtatás</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1>Bartender Nyomtatás</h1>
    <form id="printForm">
      <div class="mb-3">
        <label for="inputString" class="form-label">Írd be a PN stringet (pl. PN-ABC123|):</label>
        <input type="text" id="inputString" name="inputString" class="form-control" placeholder="PN-ABC123|" required>
      </div>
      <button type="submit" class="btn btn-primary">Nyomtatás</button>
    </form>
    <h3 id="responseMessage" class="mt-4"></h3>
  </div>

<script>
  $(document).ready(function() {
    $("#printForm").on("submit", function(e) {
      e.preventDefault();
      let inputStr = $("#inputString").val().trim();

      if (!inputStr) {
        alert("Kérlek, írj be valamit!");
        return;
      }

      $.post("/bartender_print", { text: inputStr }, function(data) {
        $("#responseMessage").text("Sikeres: " + JSON.stringify(data));
      })
      .fail(function(xhr) {
        $("#responseMessage").text("Hiba: " + xhr.responseJSON?.error || xhr.statusText);
      });
    });
  });
</script>
</body>
</html>
{% endblock %}
