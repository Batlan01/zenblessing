$("#checkPrinterPNButton").click(function() {
  const pn = $("#pnPrinterInput").val().trim();
  if (!pn) {
    alert("Adj meg PN-t!");
    return;
  }

  fetch('/check_pn_in_t_dump', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pn })
  })
  .then(res => res.json())
  .then(data => {
    const button = $("#checkPrinterPNButton");
    if (data.found) {
      button.removeClass("btn-secondary").addClass("btn-success");
      button.html("✔ PN megtalálva");
    } else {
      button.removeClass("btn-secondary").addClass("btn-danger");
      button.html("❌ PN nem található");
    }
  })
  .catch(err => {
    console.error("❌ Hiba PN ellenőrzés közben:", err);
    alert("Hiba történt a PN ellenőrzése során.");
  });
});

// FROM-TO adatok betöltése
function loadFromToData() {
  const blocks = document.querySelectorAll('#labelBlocksContainer .row');
  blocks.forEach(block => {
    const page = block.dataset.page;
    const group = block.dataset.group;
    const key = `page-${page}-group-${group}`;
    
    if (formState.fromToData[key]) {
      const data = formState.fromToData[key];
      block.querySelector('.fromTemplateSelect').value = data.fromTemplate || '';
      block.querySelector('.fromText1').value = data.fromText1 || '';
      block.querySelector('.fromText2').value = data.fromText2 || '';
      block.querySelector('.toTemplateSelect').value = data.toTemplate || '';
      block.querySelector('.toText1').value = data.toText1 || '';
      block.querySelector('.toText2').value = data.toText2 || '';
    }
  });
}


// Konnektor változások figyelése
function watchConnectorChanges() {
  const observer = new MutationObserver(mutations => {
    let shouldUpdate = false;

    mutations.forEach(mutation => {
      if (mutation.type === 'childList') {
        if (mutation.addedNodes.length > 0 || mutation.removedNodes.length > 0) {
          shouldUpdate = true;
        }
      }
    });

    if (shouldUpdate) {
      // 🟢 Állapot mentése
      const savedSelections = saveFromToSelections();

      renderLabelBlocks();

      // 🟢 Visszatöltés
      restoreFromToSelections(savedSelections);

      loadFromToData();

      if (document.getElementById('useIdLabels')?.checked) {
        renderIdLabelFields();
      }
      
      if (document.getElementById('useFromTo')?.checked) {
        const savedSelections = saveFromToSelections();
        renderLabelBlocks(); // 🔥 Ez most már feltöltve kapja a konnektorokat
        restoreFromToSelections(savedSelections);
      }

    }
  });

  const container = document.getElementById('connectorHierarchyContainer');
  if (container) {
    observer.observe(container, {
      childList: true,
      subtree: true
    });
  }
}

function getBtwFiles(callback) {
  const now = Date.now();
  if (btwFilesCache.length > 0 && (now - btwFilesLastLoaded) < btwFilesCacheTTL) {
    callback(btwFilesCache);
  } else {
    $.get("/get_btw_files", function(data) {
      btwFilesCache = data.files || [];
      btwFilesLastLoaded = Date.now();
      callback(btwFilesCache);
    });
  }
}


function getCurrentConnectorStructure() {
  const structure = [];
  const pageDivs = document.querySelectorAll('#connectorHierarchyContainer .border.bg-light');

  pageDivs.forEach((pageDiv, pageIndex) => {
    const pageObj = { page: pageIndex + 1, groups: [] };
    const groupDivs = pageDiv.querySelectorAll('.connector-group-list > div');

    groupDivs.forEach((groupDiv, groupIndex) => {
      const groupObj = { group: groupIndex + 1, connectors: [] };
      const connectorInputs = groupDiv.querySelectorAll('.connector-list .d-flex');

      connectorInputs.forEach(inputRow => {
        const id = inputRow.querySelector('.connector-id')?.value.trim() || '';
        const value = inputRow.querySelector('.connector-value')?.value.trim() || '';
        if (id) {
          groupObj.connectors.push({ id, value });
        }
      });

      pageObj.groups.push(groupObj);
    });

    structure.push(pageObj);
  });
  return structure;
}

function saveLabelConfig() {
  const pn = document.getElementById('pnInput')?.value.trim();
  const rev = document.getElementById('revInput')?.value.trim();
  const ecn = document.getElementById('ecnInput')?.value.trim();
  const id_template = document.querySelector('.idTemplateSelect')?.value || '';

  if (!pn || !id_template || !rev || !ecn) {
    alert("PN, REV, ECN es ID sablon kötelező!");
    return;
  }

  const structure = getCurrentConnectorStructure();

  const idLabels = [];
  document.querySelectorAll('#idLabelBlocks .idLabelBlock').forEach((block, index) => {
    const template = block.querySelector('.idTemplateSelect')?.value || '';
    const printer = block.querySelector('.printerSelect')?.value || '';
    const page = parseInt(block.querySelector('.connectorPageSelect')?.value || 0) + 1;
    const group = parseInt(block.querySelector('.connectorGroupSelect')?.value || 0) + 1;

    idLabels.push({
      id_index: index + 1,
      template,
      printer,
      page,
      group
    });
  });

  const pages = [];
  const labelBlocks = document.querySelectorAll('#labelBlocksContainer .row');
  let blockIndex = 0;

  // Debug: várható blokkok száma
  const expectedBlocks = structure.reduce((acc, page) => {
    return acc + page.groups.reduce((sum, group) => {
      return sum + Math.max(1, group.connectors.length - 1);
    }, 0);
  }, 0);

  console.log("Label blokkok a DOM-ban:", labelBlocks.length);
  console.log("Várt blokkszám a structure alapján:", expectedBlocks);

  structure.forEach((page, pageIndex) => {
    const pageObj = {
      page: pageIndex + 1,
      groups: [],
      id_labels: idLabels.filter(label => label.page === pageIndex + 1)
    };

    page.groups.forEach((group, groupIndex) => {
      const groupObj = {
        group: groupIndex + 1,
        connectors: group.connectors,
        pairs: []
      };

      const pairCount = Math.max(1, group.connectors.length - 1);

      for (let i = 0; i < pairCount; i++) {
        const block = labelBlocks[blockIndex];
        if (!block) {
          console.warn(`Hiányzó blokk: page ${pageIndex + 1}, group ${groupIndex + 1}, pair ${i + 1}`);
          blockIndex++;
          continue;
        }

        const from = {
          template: block.querySelector('.fromTemplateSelect')?.value?.trim() || '',
          text1: block.querySelectorAll('.fromText1')[0]?.value?.trim() || '',
          text2: block.querySelectorAll('.fromText2')[0]?.value?.trim() || ''
        };

        const to = {
          template: block.querySelector('.toTemplateSelect')?.value?.trim() || '',
          text1: block.querySelectorAll('.toText1')[0]?.value?.trim() || '',
          text2: block.querySelectorAll('.toText2')[0]?.value?.trim() || ''
        };

        // Csak akkor mentsük, ha van benne érték
        if (from.template || from.text1 || from.text2 || to.template || to.text1 || to.text2) {
          groupObj.pairs.push({ from, to });
        } else {
          console.log(`Üres pár kihagyva (page ${pageIndex + 1}, group ${groupIndex + 1}, pair ${i + 1})`);
        }

        blockIndex++;
      }

      // FROM–TO csoportszinten (ha van legalább 1 pár)
      if (groupObj.pairs.length > 0) {
        groupObj.from = groupObj.pairs[0].from;
        groupObj.to = groupObj.pairs[0].to;
      }

      pageObj.groups.push(groupObj);
    });

    pages.push(pageObj);
  });

  // Adat mentése szerverre
  fetch('/save_label_config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      pn,
      rev,
      ecn,
      id_template,
      pages
    })
  })
    .then(res => res.json())
    .then(data => {
      if (data.status === 'success') {
        alert("Sikeres mentés!");
        document.getElementById('pnInput').value = '';
        document.querySelector('.idTemplateSelect').selectedIndex = 0;
        document.getElementById('labelBlocksContainer').innerHTML = '';
        document.getElementById('connectorHierarchyContainer').innerHTML = '';
        document.getElementById('summaryContent').innerHTML = '';
        document.getElementById('modal').style.display = 'none';
      } else {
        alert("Hiba: " + data.message);
      }
    })
    .catch(error => {
      console.error("Mentési hiba:", error);
      alert("Hiba történt a mentés során");
    });
}

function fillConnectorOptions(selectElement, connectors) {
  if (!selectElement) return;
  
  selectElement.innerHTML = '<option value="">-- Válassz konnektort --</option>';
  connectors.forEach(conn => {
    if (conn.id) {
      const option = document.createElement('option');
      option.value = conn.id;
      option.textContent = conn.id;
      selectElement.appendChild(option);
    }
  });
}

function setupAutoFill(block, selectSelector, inputSelector, connectors) {
  const select = block.querySelector(selectSelector);
  const input = block.querySelector(inputSelector);
  
  if (!select || !input) return;
  
  select.addEventListener('change', () => {
    const connectorId = select.value;
    const connector = connectors.find(c => c.id === connectorId);
    if (connector && connector.value) {
      input.value = connector.value;
    }
  });
}

function syncToFrom(fromTextArea) {
    const fromBlock = fromTextArea.closest('.label-block');
    const toTextArea = fromBlock.querySelector('.to-text');

    const fromLines = fromTextArea.value.split('\n');

    if (fromLines.length >= 2) {
        const first = fromLines[0].trim();
        const separator = fromLines[1].trim() || '---';
        const third = fromLines[2] ? fromLines[2].trim() : '';
        toTextArea.value = `${third}\n${separator}\n${first}`;
    }
}

function toggleInputs(container, disable = true) {
  const inputs = container.querySelectorAll('input');
  const buttons = container.querySelectorAll('button');

  inputs.forEach(input => input.disabled = disable);
  buttons.forEach(button => {
    const isDeleteBtn = button.textContent.includes('🗑️');
    if (!isDeleteBtn) button.disabled = disable;
  });
}


function fillFromToFieldsFromConnectors() {
  const blocks = document.querySelectorAll('#labelBlocksContainer .row');
  const groups = document.querySelectorAll('#connectorHierarchyContainer .connector-group-list > div');

  blocks.forEach((block, index) => {
    const groupDiv = groups[index];
    if (!groupDiv) return;

    const connectorInputs = Array.from(groupDiv.querySelectorAll('.connector-list input'))
                                .map(inp => inp.value.trim())
                                .filter(v => v !== '');

    const fromText1 = block.querySelector('.fromText1');
    const fromText2 = block.querySelector('.fromText2');
    const toText1 = block.querySelector('.toText1');
    const toText2 = block.querySelector('.toText2');

    fromText1.value = connectorInputs[0] || '';
    fromText2.value = connectorInputs[1] || '';

    toText1.value = connectorInputs[connectorInputs.length - 1] || '';
    toText2.value = connectorInputs[connectorInputs.length - 2] || '';
  });
}

function loadLabelConfig(pn, rev, ecn) {
  fetch('/load_label_config', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pn, rev, ecn })
  })
  .then(res => res.json())
  .then(data => {
    if (data.status !== 'success') return;
    
    // Elmentjük a globális állapotba
    currentConfig = data.data;
    console.log("Betöltött konfig:", currentConfig);

    const config = data.data;
    console.log("Betöltött konfig:", config);

    // Alapadatok betöltése
    // Alapadatok betöltése
    document.getElementById('pnInput').value = pn;       
    document.getElementById('revInput').value = config.rev;
    document.getElementById('ecnInput').value = config.ecn;

    
    // Töröljük a meglévő oldalakat
    const container = document.getElementById('connectorHierarchyContainer');
    container.innerHTML = '';

    // Oldalak hozzáadása
    config.summary.forEach(page => {
      console.log("Addconnectorpage");
      addConnectorPage(); // új oldal hozzáadása

      // Az utolsó hozzáadott oldal
      const pageDivs = container.querySelectorAll('.border.bg-light');
      const pageDiv = pageDivs[pageDivs.length - 1];

      // Csoportok hozzáadása ehhez az oldalhoz
      page.groups.forEach(group => {
        const groupList = pageDiv.querySelector('.connector-group-list');
        addConnectorGroup(groupList, group.group);

        // Az utolsó csoport
        const groupDiv = groupList.lastElementChild;
        const connectorList = groupDiv.querySelector('.connector-list');

        // Konnektorok hozzáadása
        group.connectors.forEach(connector => {
          addConnectorInput(connectorList, connector.id, connector.value);
        });
      });
    });
    console.log("initSettingsAfterLoad");
    // Inicializáljuk a beállításokat
    initSettingsAfterLoad(config);
  })
  .catch(error => {
    console.error("Hiba a betöltés során:", error);
    alert("Hiba a PN betöltése közben.");
  });
}

function initSettingsAfterLoad(config) {
  if (!config) return;

  // Checkboxok beállítása
  const hasIdLabels = config.summary?.some(page => page.id_labels && page.id_labels.length > 0);
  document.getElementById('useIdLabels').checked = hasIdLabels;

  document.getElementById('useConnectors').checked = 
    config.summary?.some(p => p.groups?.length > 0) || false;

  // Fülek újrarenderelése
  renderSettingsTabs();

  // ID template beállítása
  setTimeout(() => {
    const idTemplateSelect = document.getElementById('idTemplateSelect');
    if (idTemplateSelect && config.id_template) {
      idTemplateSelect.value = config.id_template;
    }
  }, 500);

  // 🟢 FROM–TO mezők betöltése a summary alapján
  setTimeout(() => {
    const savedSelections = saveFromToSelections(); // ha van korábbi érték
    renderLabelBlocks();
    restoreFromToSelections(savedSelections);

    // Summary adatok alapján feltöltés
    // Summary adatok alapján feltöltés
    const labelBlocks = document.querySelectorAll('#labelBlocksContainer .row');

    let blockIndex = 0;
    config.summary.forEach(page => {
      page.groups.forEach(group => {
        const pairs = group.pairs || [];
        pairs.forEach(pair => {
          const block = labelBlocks[blockIndex];
          if (block) {
            setValue(block, '.fromTemplateSelect', pair.from?.template);
            setValue(block, '.fromText1', pair.from?.text1);
            setValue(block, '.fromText2', pair.from?.text2);

            setValue(block, '.toTemplateSelect', pair.to?.template);
            setValue(block, '.toText1', pair.to?.text1);
            setValue(block, '.toText2', pair.to?.text2);
          }
          blockIndex++;
        });
      });
    });

  }, 800);
}

function renderSchematic() {
  const container = document.getElementById('tabContent-schematic');
  container.innerHTML = '';

  // Összegzés (ID labelek) – oldal + csoport bontásban
  const summary = [];

  document.querySelectorAll('.idLabelBlock').forEach((block, index) => {
    const template = block.querySelector('.idTemplateSelect')?.value || '';
    const printer = block.querySelector('.printerSelect')?.value || '';
    const page = parseInt(block.querySelector('.connectorPageSelect')?.value || '0') + 1;
    const group = parseInt(block.querySelector('.connectorGroupSelect')?.value || '0') + 1;

    let pageEntry = summary.find(p => p.page === page);
    if (!pageEntry) {
      pageEntry = { page, groups: [] };
      summary.push(pageEntry);
    }

    let groupEntry = pageEntry.groups.find(g => g.group === group);
    if (!groupEntry) {
      groupEntry = { group, id_labels: [] };
      pageEntry.groups.push(groupEntry);
    }

    groupEntry.id_labels.push({
      id_index: index + 1,
      template,
      printer
    });
  });

  const structure = getCurrentConnectorStructure();
  if (!structure.length) {
    container.innerHTML = '<p>Nincs elérhető konnektorstruktúra.</p>';
    return;
  }

  const fromToBlocks = document.querySelectorAll('#labelBlocksContainer .row');
  let blockIndex = 0;

  structure.forEach((page, pageIndex) => {
    const pageDiv = document.createElement('div');
    pageDiv.className = 'schematic-page mb-5 p-3 border rounded';
    pageDiv.innerHTML = `<h4 class="mb-3">Oldal ${pageIndex + 1}</h4>`;
    container.appendChild(pageDiv);

    const summaryPage = summary.find(p => p.page === pageIndex + 1);

    page.groups.forEach((group, groupIndex) => {
      const groupDiv = document.createElement('div');
      groupDiv.className = 'schematic-group mb-4 p-2 border rounded';
      groupDiv.innerHTML = `<h5 class="mb-2">Csoport ${group.group}</h5>`;
      pageDiv.appendChild(groupDiv);

      // ID dobozok konténer
      const idContainer = document.createElement('div');
      idContainer.className = 'schematic-id-container mb-3 d-flex flex-wrap gap-2';
      groupDiv.appendChild(idContainer);

      // FROM–TO dobozok konténer
      const fromToContainer = document.createElement('div');
      fromToContainer.className = 'schematic-fromto-container d-flex flex-wrap gap-2';
      groupDiv.appendChild(fromToContainer);

      // ID-k (ha vannak)
      const summaryGroup = summaryPage?.groups?.find(g => g.group === group.group);
      if (summaryGroup?.id_labels?.length > 0) {
        summaryGroup.id_labels.forEach(() => {
          const idBox = document.createElement('div');
          idBox.className = 'schematic-box id-box text-center';
          idBox.textContent = 'ID';
          idContainer.appendChild(idBox);
        });
      }

      // FROM–TO-k
      const pairCount = Math.max(1, (group.connectors?.length || 0) - 1);
      for (let pairIndex = 0; pairIndex < pairCount; pairIndex++) {
        const fromTo = fromToBlocks[blockIndex];
        if (!fromTo) continue;

        const fromTop = fromTo.querySelector('.fromText1')?.value || '';
        const fromBottom = fromTo.querySelector('.fromText2')?.value || '';
        const toTop = fromTo.querySelector('.toText1')?.value || '';
        const toBottom = fromTo.querySelector('.toText2')?.value || '';

        const pairWrapper = document.createElement('div');
        pairWrapper.className = 'schematic-pair-wrapper d-flex';
        pairWrapper.style.display = 'flex';
        pairWrapper.style.gap = '16px';
        pairWrapper.style.marginRight = '24px'; // ha a párok között is kell rés


        // FROM box
        const fromBox = document.createElement('div');
        fromBox.className = 'schematic-box from-box';
        fromBox.innerHTML = `
          <div class="schematic-text-top">${fromTop || '&nbsp;'}</div>
          <div class="schematic-line"></div>
          <div class="schematic-text-bottom">${fromBottom || '&nbsp;'}</div>
        `;

        // TO box
        const toBox = document.createElement('div');
        toBox.className = 'schematic-box to-box';
        toBox.innerHTML = `
          <div class="schematic-text-top">${toTop || '&nbsp;'}</div>
          <div class="schematic-line"></div>
          <div class="schematic-text-bottom">${toBottom || '&nbsp;'}</div>
        `;

        pairWrapper.appendChild(fromBox);
        pairWrapper.appendChild(toBox);

        // 🔄 spacer minden 2. pár után
        if ((pairIndex + 1) % 2 === 0) {
          const spacer = document.createElement('div');
          spacer.style.width = '34px';
          spacer.style.minHeight = '1px';
          spacer.style.background = 'transparent'; // vagy 'red' teszthez
          pairWrapper.appendChild(spacer);
        }

        fromToContainer.appendChild(pairWrapper);


        blockIndex++;
      }


    });
  });
}


function resetAllFields() {
  // Alap input mezők ürítése
  document.getElementById('pnInput').value = '';
  document.getElementById('revInput').value = '';
  document.getElementById('ecnInput').value = '';

  // Sablon select(ek) első opcióra
  document.querySelectorAll('.idTemplateSelect').forEach(sel => sel.selectedIndex = 0);
  document.querySelectorAll('.fromTemplateSelect').forEach(sel => sel.selectedIndex = 0);
  document.querySelectorAll('.toTemplateSelect').forEach(sel => sel.selectedIndex = 0);

  // Minden label blokkok törlése
  const labelBlocks = document.getElementById('labelBlocksContainer');
  if (labelBlocks) labelBlocks.innerHTML = '';

  // Konnektorok törlése
  const connectorContainer = document.getElementById('connectorHierarchyContainer');
  if (connectorContainer) connectorContainer.innerHTML = '';

  // ID label blokkok törlése
  const idLabelBlocks = document.getElementById('idLabelBlocks');
  if (idLabelBlocks) idLabelBlocks.innerHTML = '';

  // Summary törlése
  const summaryContent = document.getElementById('summaryContent');
  if (summaryContent) summaryContent.innerHTML = '';

  // Checkboxok vissza alapértelmezett állapotba (ha szükséges)
  document.getElementById('useIdLabels').checked = true;
  document.getElementById('useFromTo').checked = true;
  document.getElementById('useConnectors').checked = false;

  // Ha bármilyen globális állapot (currentConfig, AppState stb.) van, nullázd:
  currentConfig = null;
}


document.getElementById('closeModal').addEventListener('click', () => {
  resetAllFields();
  document.getElementById('modal').style.display = 'none';
});

['useIdLabels', 'useFromTo', 'useConnectors'].forEach(id => {
  document.getElementById(id).addEventListener('change', renderSettingsTabs);
});

function resetCheckButton() {
  const btn = document.getElementById('checkPNButton');
  btn.classList.remove('btn-success', 'btn-danger');
  btn.classList.add('btn-secondary');
  btn.textContent = "🔍 Ellenőrzés";
}

document.addEventListener('DOMContentLoaded', () => {
  ['pnInput', 'revInput', 'ecnInput'].forEach(id => {
    const input = document.getElementById(id);
    if (input) {
      input.addEventListener('input', resetCheckButton);
    }
  });

  document.getElementById('addButton').addEventListener('click', resetCheckButton);
  document.getElementById('editButton').addEventListener('click', resetCheckButton);
});





</script>


</body>
</html>
{% endblock %}
