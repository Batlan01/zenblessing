{% extends 'sk/base.html' %}

{% block content %}
<!DOCTYPE html>

<html lang="hu">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BarTender Print Page</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">


<link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet"/></head>
<body>
<!-- Gombok -->
<button class="btn" id="addButton">+</button>
<button class="btn" id="editButton">EDIT</button>
<!-- Új bejegyzés hozzáadása -->
<div class="modal" id="modal">
<span class="close" id="closeModal">×</span>
<h2>Új Bejegyzés</h2>
<table>
<thead>
<tr>
<th>PN</th>
<th>ETIKET</th>
<th>CHECK</th>
<th>CONFIRM</th>
</tr>
</thead>
<tbody>
<tr>
<td><input id="pnInput" type="text"/></td>
<td>
<select id="etiketSelect">
<option value="">Fájlok betöltése...</option>
</select>
</td>
<td>
<button class="btn checkNewBtn">CHECK</button>
<span class="status-icon"></span>
</td>
<td>
<button class="btn confirmBtn" disabled="">CONFIRM</button>
</td>
</tr>
</tbody>
</table>
</div>
<!-- Adatok szerkesztése -->
<div class="modal" id="editModal">
<span class="close" id="closeEditModal">×</span>
<h2>Adatok szerkesztése</h2>
<table>
<thead>
<tr>
<th>ID</th>
<th>PN</th>
<th>ETIKET</th>
<th>CHECK</th>
<th>UPDATE</th>
</tr>
</thead>
<tbody id="editTableBody"></tbody>
</table>
</div>
<!-- Megerősítő ablak -->
<div id="confirmDialog">
<p>Biztosan menteni akarod a módosításokat?</p>
<button class="btn" id="confirmYes">Igen</button>
<button class="btn" id="confirmNo">Nem</button>
</div>
<script>
        $(document).ready(function() {
            let pendingUpdates = [];

            $("#addButton").click(function() {
                $("#modal").show();
                loadEtiketFiles();
            });

            $("#closeModal").click(function() {
                $("#modal").hide();
            });

            $("#editButton").click(function() {
                $("#editModal").show();
                loadEditData();  // **API meghívása**
            });

            $("#closeEditModal").click(function() {
                $("#editModal").hide();
            });

            function loadEtiketFiles() {
                $.get("/get_btw_files", function(data) {
                    let select = $("#etiketSelect");
                    select.empty();
                    data.files.forEach(file => {
                        select.append(`<option value="${file}">${file}</option>`);
                    });
                });
            }

            function loadEditData() {
                $.get("/get_edit_data", function(data) {
                    let tbody = $("#editTableBody");
                    tbody.empty();
                    
                    data.records.forEach(record => {
                        let row = `
                            <tr data-id="${record.ID}">
                                <td>${record.ID}</td>
                                <td><input type="text" class="pnInput" value="${record.PN}"></td>
                                <td>
                                    <select class="etiketSelect">
                                        ${data.files.map(file => `<option value="${file}" ${file === record.etiket ? 'selected' : ''}>${file}</option>`).join('')}
                                    </select>
                                </td>
                                <td>
                                    <button class="btn checkBtn">CHECK</button>
                                    <span class="status-icon"></span>
                                </td>
                                <td>
                                    <button class="btn updateBtn" disabled>UPDATE</button>
                                </td>
                            </tr>
                        `;
                        tbody.append(row);
                    });
                });
            }

            $(document).on("click", ".checkBtn", function() {
                let row = $(this).closest("tr");
                let pnValue = row.find(".pnInput").val().trim().toLowerCase();
                let statusIcon = row.find(".status-icon");
                let updateBtn = row.find(".updateBtn");

                $.post("/check_pn", { pn: pnValue }, function(data) {
                    if (data.found) {
                        statusIcon.html("✔").addClass("green-check").removeClass("red-cross");
                        updateBtn.prop("disabled", false);
                    } else {
                        statusIcon.html("✖").addClass("red-cross").removeClass("green-check");
                        updateBtn.prop("disabled", true);
                    }
                });
            });

            $(document).on("click", ".updateBtn", function() {
                let row = $(this).closest("tr");
                let id = row.data("id");
                let pn = row.find(".pnInput").val();
                let etikett = row.find(".etiketSelect").val();

                pendingUpdates = [{ id, pn, etikett }];

                $("#confirmDialog").show();
            });

            $("#confirmYes").click(function() {
                $.post("/bartender_update_data", { updates: JSON.stringify(pendingUpdates) }, function(response) {
                    alert(response.message);
                    $("#confirmDialog").hide();
                    $("#editModal").hide();
                });
            });

            $("#confirmNo").click(function() {
                pendingUpdates = [];
                $("#confirmDialog").hide();
            });

        });
    </script>
</body>
</html>
{% endblock %}
