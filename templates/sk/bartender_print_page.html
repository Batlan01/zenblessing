{% extends 'sk/base.html' %}

{% block content %}
<!DOCTYPE html>

<html lang="sk">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nastavenie tlače</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <body>
        <div style="text-align: right; margin-top: 10px;">
            <a href="{{ url_for('bartender_print_page', lang='hu') }}">
                <img src="{{ url_for('static', filename='flags/hu.png') }}" alt="Magyar" style="width: 32px; height: 20px; margin-right: 10px;">
            </a>
            <a href="{{ url_for('bartender_print_page', lang='sk') }}">
                <img src="{{ url_for('static', filename='flags/sk.png') }}" alt="Slovenský" style="width: 32px; height: 20px;">
            </a>
        </div>
        <h1>BarTender Tlac Stranka</h1>
<h2>Nastavenie tlače</h2>
<form id="printForm">
<label for="pn">PN (Číslo dielu):</label>
<input id="pn" name="pn" onblur="fetchBtwFile()" type="text"/><br/><br/>
<label for="etiket_file">Automaticky vybratý BTW súbor:</label>
<input id="etiket_file" name="etiket_file" readonly="" type="text"/><br/><br/>
<label for="qty">Počet kusov:</label>
<input id="qty" name="qty" type="number" value="1"/><br/><br/>
<label for="printer">Tlačiareň:</label>
<input id="printer" name="printer" type="text" value="SIL-PRT-28 (A3)"/><br/><br/>
<label for="named_data_source">Hodnota Named Data Source:</label>
<input id="named_data_source" name="named_data_source" type="text" value="DefaultValue"/><br/><br/>
<button onclick="sendPrintRequest()" type="button">Tlačiť</button>
</form>
<h3 id="responseMessage"></h3>
<script>
        function fetchBtwFile() {
            let pnValue = $("#pn").val().trim();

            if (!pnValue) {
                $("#etiket_file").val("");
                return;
            }

            $.post("/get_btw_from_pn", { pn: pnValue }, function(data) {
                if (data.found) {
                    $("#etiket_file").val(data.etiket);
                } else {
                    alert("PN sa nenašlo v databáze!");
                    $("#etiket_file").val("");
                }
            }).fail(function(xhr) {
                alert("Vyskytla sa chyba: " + xhr.responseJSON.error);
            });
        }

        function sendPrintRequest() {
            let formData = new FormData(document.getElementById("printForm"));

            fetch("/bartender_print", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("responseMessage").innerText = 
                    "Úspešná tlač: " + JSON.stringify(data, null, 2);
            })
            .catch(error => {
                document.getElementById("responseMessage").innerText = 
                    "Chyba: " + error;
            });
        }
</script>
</body>
</html>
{% endblock %}
